services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: messages_db
    ports:
      - "3306:3306"
    volumes:
#      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  authservice:
    build: ./authservice
    ports:
      - "9000:9000"
    depends_on:
      - mysql
      - userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      USER_SERVICE_URL: http://userservice:8083
  messageservice:
    build: ./messageservice
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - rabbitmq
      - userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/messages_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_ADDRESS: userservice:8083
  userservice:
    build: ./userservice
    ports:
      - "8083:8083"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
  botservice:
    build: ./botservice
    ports:
      - "8082:8082"
    depends_on:
      - messageservice
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      MESSAGE_SERVICE_URL: http://messageservice:8081
  bff:
    build: ./bff
    ports:
      - "8080:8080"
    depends_on:
      - authservice
      - userservice
      - messageservice
    environment:
      AUTH_SERVICE_URL: http://authservice:9000
      USER_SERVICE_URL: http://userservice:8083
      MESSAGE_SERVICE_URL: http://messageservice:8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://authservice:9000/auth/jwks

volumes:
  mysql_data:
