services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: messages_db
    ports:
      - "3306:3306"
    volumes:
#      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  authservice:
    build: ./authservice
    ports:
      - "9000:9000"
  messageservice:
    build: ./messageservice
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - rabbitmq
      - userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/messages_db
      SPRING_RABBITMQ_HOST: rabbitmq
  userservice:
    build: ./userservice
    ports:
      - "8083:8083"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_db
      SPRING_RABBITMQ_HOST: rabbitmq
  botservice:
    build: ./botservice
    ports:
      - "8082:8082"
    depends_on:
      - messageservice
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      MESSAGE_SERVICE_URL: http://messageservice:8081

volumes:
  mysql_data:
