services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: messages_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    secrets:
      - mysql_root_password
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER_FILE: /run/secrets/rabbitmq_username
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_username
      - rabbitmq_password
  authservice:
    build: ./authservice
    ports:
      - "9000:9000"
    depends_on:
      - mysql
      - userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      USER_SERVICE_URL: http://userservice:8083
      AUTH_ISSUER: http://authservice:9000
      AUTH_OAUTH_CLIENT_ID: gateway-client
      AUTH_OAUTH_REDIRECT_URI: http://localhost:8080/login/oauth2/code/authservice
      AUTH_SIGNING_KEY_PATH: /auth-keys/authservice-ec-key.json
    volumes:
      - auth_keys:/auth-keys
    secrets:
      - source: mysql_root_password
        target: spring.datasource.password
      - source: internal_api_key
        target: internal.api-key
      - source: auth_oauth_client_secret
        target: auth.oauth-client-secret
  messageservice:
    build: ./messageservice
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - rabbitmq
      - userservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/messages_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_ADDRESS: userservice:8083
      BOT_USER_ID: 0
      BOT_USERNAME: bot
    secrets:
      - source: mysql_root_password
        target: spring.datasource.password
      - source: rabbitmq_username
        target: spring.rabbitmq.username
      - source: rabbitmq_password
        target: spring.rabbitmq.password
      - source: internal_api_key
        target: internal.api-key
  userservice:
    build: ./userservice
    ports:
      - "8083:8083"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
    secrets:
      - source: mysql_root_password
        target: spring.datasource.password
      - source: internal_api_key
        target: internal.api-key
  botservice:
    build: ./botservice
    ports:
      - "8082:8082"
    depends_on:
      - messageservice
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      MESSAGE_SERVICE_URL: http://messageservice:8081
      BOT_USER_ID: 0
      BOT_USERNAME: bot
      BOT_AI_ENABLED: ${BOT_AI_ENABLED:-false}
      BOT_AI_BASE_URL: ${BOT_AI_BASE_URL:-https://openrouter.ai/api/v1}
      BOT_AI_API_KEY: ${OPENROUTER_API_KEY:-}
      BOT_AI_MODEL: ${BOT_AI_MODEL:-z-ai/glm-4.5-air:free}
      BOT_AI_TEMPERATURE: ${BOT_AI_TEMPERATURE:-0.3}
    secrets:
      - source: rabbitmq_username
        target: spring.rabbitmq.username
      - source: rabbitmq_password
        target: spring.rabbitmq.password
      - source: internal_api_key
        target: internal.api-key
  bff:
    build: ./bff
    ports:
      - "8080:8080"
    depends_on:
      - authservice
      - userservice
      - messageservice
    environment:
      AUTH_SERVICE_URL: http://authservice:9000
      USER_SERVICE_URL: http://userservice:8083
      MESSAGE_SERVICE_URL: http://messageservice:8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://authservice:9000/auth/jwks
      BOT_AI_ENABLED: ${BOT_AI_ENABLED:-false}
    secrets:
      - source: internal_api_key
        target: internal.api-key

volumes:
  mysql_data:
  auth_keys:

secrets:
  mysql_root_password:
    file: ./secrets/mysql-root-password.txt
  rabbitmq_username:
    file: ./secrets/rabbitmq-username.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq-password.txt
  internal_api_key:
    file: ./secrets/internal-api-key.txt
  auth_oauth_client_secret:
    file: ./secrets/auth-oauth-client-secret.txt
