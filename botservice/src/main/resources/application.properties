spring.application.name=botservice
server.port=8082
spring.config.import=optional:configtree:/run/secrets/

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000

message.service.url=${MESSAGE_SERVICE_URL:http://localhost:8081}
internal.api-key=${INTERNAL_API_KEY}
bot.user-id=${BOT_USER_ID:0}
bot.username=${BOT_USERNAME:bot}
bot.ai.enabled=${BOT_AI_ENABLED:false}
bot.ai.base-url=${BOT_AI_BASE_URL:https://openrouter.ai/api/v1}
bot.ai.api-key=${BOT_AI_API_KEY:${OPENROUTER_API_KEY:}}
bot.ai.model=${BOT_AI_MODEL:z-ai/glm-4.5-air:free}
bot.ai.temperature=${BOT_AI_TEMPERATURE:0.3}

logging.level.org.example.botservice=DEBUG
