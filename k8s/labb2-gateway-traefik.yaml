apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: labb2
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: labb2-gateway
  namespace: labb2
  labels:
    app.kubernetes.io/name: labb2-gateway
    app.kubernetes.io/part-of: labb2
    app.kubernetes.io/component: edge-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      hostname: labb2.localhost
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-route
  namespace: labb2
  labels:
    app.kubernetes.io/name: bff-route
    app.kubernetes.io/part-of: labb2
spec:
  parentRefs:
    - name: labb2-gateway
      sectionName: http
  hostnames:
    - labb2.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bff
          port: 8080
          weight: 1
