# Exempelmall. Kopiera till labb2-secrets.local.yaml, byt alla varden och commita inte local-filen.
apiVersion: v1
kind: Secret
metadata:
  name: labb2-secret
  namespace: labb2
type: Opaque
stringData:
  mysql-root-password: replace-with-a-generated-password
  rabbitmq-username: labb2_rabbit
  rabbitmq-password: replace-with-a-generated-password
  internal-api-key: replace-with-a-generated-api-key
  auth-oauth-client-secret: replace-with-a-generated-client-secret
