    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authservice
        app.kubernetes.io/part-of: labb2
        app.kubernetes.io/component: auth-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: authservice
          image: labb2-authservice:native
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: mysql-root-password
            - name: USER_SERVICE_URL
              value: http://userservice:8083
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: internal-api-key
            - name: AUTH_ISSUER
              value: http://authservice:9000
            - name: AUTH_OAUTH_CLIENT_ID
              value: gateway-client
            - name: AUTH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: auth-oauth-client-secret
