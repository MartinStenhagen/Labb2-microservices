            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: mysql-root-password
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: rabbitmq-password
            - name: SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_ADDRESS
              value: userservice:8083
            - name: SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_SECURE
              value: "false"
            - name: INTERNAL_API_KEY
              valueFrom:
