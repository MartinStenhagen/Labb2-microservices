apiVersion: v1
kind: Namespace
metadata:
  name: labb2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-ai-config
  namespace: labb2
data:
  BOT_AI_ENABLED: "false"
  BOT_AI_BASE_URL: "https://openrouter.ai/api/v1"
  BOT_AI_MODEL: "z-ai/glm-4.5-air:free"
  BOT_AI_TEMPERATURE: "0.3"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-keys
  namespace: labb2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: labb2
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: labb2
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: labb2
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: mysql-root-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-databases
  namespace: labb2
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-init-databases
        app.kubernetes.io/part-of: labb2
        app.kubernetes.io/component: database-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-init
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: mysql-root-password
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent; do
                echo "Waiting for MySQL..."
                sleep 2
              done
              mysql -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "CREATE DATABASE IF NOT EXISTS users_db; CREATE DATABASE IF NOT EXISTS messages_db; CREATE DATABASE IF NOT EXISTS auth_db;"
              mysql -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" users_db <<'SQL'
              CREATE TABLE IF NOT EXISTS users (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  username VARCHAR(255) NOT NULL,
                  display_name VARCHAR(255),
                  PRIMARY KEY (id),
                  CONSTRAINT uk_users_username UNIQUE (username)
              );
              SQL
              mysql -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" auth_db <<'SQL'
              CREATE TABLE IF NOT EXISTS auth_users (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  username VARCHAR(255) NOT NULL,
                  password_hash VARCHAR(255) NOT NULL,
                  user_id BIGINT NOT NULL,
                  PRIMARY KEY (id),
                  CONSTRAINT uk_auth_users_username UNIQUE (username)
              );
              SQL
              mysql -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" messages_db <<'SQL'
              CREATE TABLE IF NOT EXISTS messages (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  sender_user_id BIGINT,
                  sender_username VARCHAR(255),
                  room VARCHAR(255) NOT NULL DEFAULT 'general',
                  content TEXT,
                  source_event_id BINARY(16),
                  created_at DATETIME(6),
                  PRIMARY KEY (id),
                  CONSTRAINT uk_messages_source_event_id UNIQUE (source_event_id)
              );

              CREATE TABLE IF NOT EXISTS outbox_events (
                  id BIGINT NOT NULL AUTO_INCREMENT,
                  event_id BINARY(16),
                  aggregate_type VARCHAR(255),
                  aggregate_id BIGINT,
                  type VARCHAR(255),
                  payload TEXT,
                  created_at DATETIME(6),
                  publish_attempts INT NOT NULL DEFAULT 0,
                  last_attempt_at DATETIME(6),
                  processed_at DATETIME(6),
                  failed_at DATETIME(6),
                  last_error TEXT,
                  status ENUM('PENDING', 'PUBLISHING', 'PROCESSED', 'FAILED'),
                  PRIMARY KEY (id)
              );

              SET @sql = IF(
                  (SELECT COUNT(*) FROM information_schema.statistics
                   WHERE table_schema = DATABASE() AND table_name = 'messages' AND index_name = 'idx_messages_room_created_at') = 0,
                  'CREATE INDEX idx_messages_room_created_at ON messages (room, created_at)',
                  'SELECT 1'
              );
              PREPARE stmt FROM @sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;

              SET @sql = IF(
                  (SELECT COUNT(*) FROM information_schema.statistics
                   WHERE table_schema = DATABASE() AND table_name = 'outbox_events' AND index_name = 'idx_outbox_events_status_created_at') = 0,
                  'CREATE INDEX idx_outbox_events_status_created_at ON outbox_events (status, created_at)',
                  'SELECT 1'
              );
              PREPARE stmt FROM @sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;

              SET @sql = IF(
                  (SELECT COUNT(*) FROM information_schema.statistics
                   WHERE table_schema = DATABASE() AND table_name = 'outbox_events' AND index_name = 'idx_outbox_events_status_last_attempt_at') = 0,
                  'CREATE INDEX idx_outbox_events_status_last_attempt_at ON outbox_events (status, last_attempt_at)',
                  'SELECT 1'
              );
              PREPARE stmt FROM @sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;
              SQL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: labb2
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: labb2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: labb2
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: labb2
        app.kubernetes.io/component: message-broker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: rabbitmq-password
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 5672
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: labb2
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: userservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: userservice
        app.kubernetes.io/part-of: labb2
        app.kubernetes.io/component: user-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: userservice
          image: labb2-userservice:native
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-grpc
              containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/users_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: mysql-root-password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: labb2-secret
                  key: internal-api-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8083
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: labb2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: userservice
  ports:
    - name: http-grpc
      port: 8083
      targetPort: 8083
---
