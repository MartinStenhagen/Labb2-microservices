              port: 9000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: auth-keys
          persistentVolumeClaim:
            claimName: auth-keys
---
