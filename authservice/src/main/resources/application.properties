spring.application.name=authservice
server.port=9000
spring.config.import=optional:configtree:/run/secrets/

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

user.service.url=${USER_SERVICE_URL:http://localhost:8083}
internal.api-key=${INTERNAL_API_KEY}
auth.issuer=${AUTH_ISSUER:http://127.0.0.1:9000}
auth.oauth-client-id=${AUTH_OAUTH_CLIENT_ID:gateway-client}
auth.oauth-client-secret=${AUTH_OAUTH_CLIENT_SECRET}
auth.oauth-redirect-uri=${AUTH_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/authservice}
auth.signing-key-path=${AUTH_SIGNING_KEY_PATH:.local/authservice-ec-key.json}
auth.signing-key-jwk=${AUTH_SIGNING_KEY_JWK:}

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.web=TRACE
logging.level.org.springframework.security.oauth2.server.authorization=TRACE
