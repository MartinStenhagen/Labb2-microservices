spring.application.name=messageservice
server.port=8081
spring.config.import=optional:configtree:/run/secrets/

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/messages_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
internal.api-key=${INTERNAL_API_KEY}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated

spring.grpc.client.default-channel.address=${SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_ADDRESS:localhost:8083}
spring.grpc.client.default-channel.secure=${SPRING_GRPC_CLIENT_DEFAULT_CHANNEL_SECURE:false}
bot.user-id=${BOT_USER_ID:0}
bot.username=${BOT_USERNAME:bot}

outbox.relay-delay-ms=5000
outbox.max-attempts=5
outbox.publishing-timeout-ms=30000

logging.level.org.example.messageservice=DEBUG
