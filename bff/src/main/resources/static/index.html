<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labb 2 Chat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
    <section id="login-view" class="login-shell">
        <div class="login-panel">
            <header>
                <h1>Labb 2 Chat</h1>
            </header>

            <form id="login-form" class="stack">
                <label for="login-username">Användarnamn</label>
                <input id="login-username" autocomplete="username">

                <label for="login-password">Lösenord</label>
                <input id="login-password" type="password" autocomplete="current-password">

                <button type="submit">Logga in</button>
            </form>

            <hr>

            <form id="user-form" class="stack">
                <h2>Skapa användare</h2>

                <label for="new-username">Användarnamn</label>
                <input id="new-username">

                <label for="display-name">Visningsnamn</label>
                <input id="display-name">

                <label for="new-password">Lösenord</label>
                <input id="new-password" type="password" autocomplete="new-password">

                <button type="submit">Skapa och logga in</button>
            </form>

            <p id="notice" class="notice"></p>
        </div>
    </section>

    <section id="chat-view" class="app-shell hidden">
        <section class="workspace">
            <header class="topbar">
                <div>
                    <h1>Labb 2 Chat</h1>
                    <p id="session-status"></p>
                </div>
                <div class="topbar-actions">
                    <label class="room-picker" for="room-select">
                        <span>Rum</span>
                        <select id="room-select">
                            <option value="general">general</option>
                            <option value="support">support</option>
                            <option value="random">random</option>
                        </select>
                    </label>
                    <button id="refresh-button" type="button" title="Uppdatera meddelanden">↻</button>
                    <button id="logout-button" type="button">Logga ut</button>
                </div>
            </header>

            <section id="messages" class="messages" aria-live="polite"></section>

            <form id="message-form" class="composer">
                <label for="message-input">Meddelande</label>
                <textarea id="message-input" rows="3" placeholder="Skriv ett meddelande"></textarea>
                <button type="submit">Skicka</button>
            </form>
        </section>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
